["ECS","Elastic Container Service","AWS's own container orchestrator.",8],
["EKS","Elastic Kubernetes Service","Managed Kubernetes.",8],
["Fargate","AWS Fargate","Runs containers for ECS/EKS without managing servers.",8],
["ECR","Elastic Container Registry","Stores Docker container images.",8],
["CDN","Content delivery network","Caches content near users. On AWS: CloudFront.",9],
["DNS","Domain Name System","Turns names like example.com into IP addresses. On AWS: Route 53.",9],
["TTL","Time to live","How long a DNS answer or cached item is kept before refreshing.",9],
["KMS","Key Management Service","Creates and controls encryption keys.",11],
["SSE","Server-side encryption","S3 encrypting your data for you: SSE-S3, SSE-KMS, SSE-C.",11],
["ACM","AWS Certificate Manager","Free SSL/TLS certificates for load balancers, CloudFront and API Gateway.",11],
["WAF","Web Application Firewall","Blocks web attacks (SQL injection, bad IPs, request floods).",11],

["SSM","AWS Systems Manager","Server management: patching, remote commands, Parameter Store.",12],
["DMS","Database Migration Service","Migrates databases to AWS with minimal downtime.",10],

["Athena","Amazon Athena","Serverless SQL queries directly on files in S3.",13],
["Glue","AWS Glue","Serverless ETL (data preparation) and data catalog.",13],
["ETL","Extract, transform, load","Moving and reshaping data from sources into an analytics store.",13],

["Bedrock","Amazon Bedrock","Generative AI foundation models through an API.",13],

["RPO","Recovery point objective","How much data, measured in time, you can afford to lose.",14],

["Subnet","Subnet","A slice of a VPC's IP range inside one AZ; public or private.",3],

].sort((a,b)=>a[0].localeCompare(b[0]));

const LETTERS = ["A","B","C","D","E"];
const KEY = "saa-course-v1";
let S = load() || {m:0, l:0, view:"module", answers:{}, orders:{}};

function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.answers && s.orders) return s; }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function order(id, n){ if(!S.orders[id] || S.orders[id].length !== n){ S.orders[id] = shuffle([...Array(n).keys()]); save(); } return S.orders[id]; }
function scrollTop(){ window.scrollTo({top:0}); }

function lessonDone(m,l){ const L = COURSE[m].lessons[l]; return L.checks.every((_,i)=>S.answers[`${m}.${l}.${i}`] !== undefined); }
function quizStats(m){
  const Q = COURSE[m].quiz; let answered=0, right=0;
  Q.forEach((q,i)=>{ const a = S.answers[`${m}.q.${i}`]; if(a!==undefined){ answered++; if(q.options[a].ok) right++; } });
  return {answered, right, total:Q.length, done:answered===Q.length};
}

function qHTML(Q, id, label){
  const ord = order(id, Q.options.length);
  const picked = S.answers[id], answered = picked !== undefined;
  return `<div class="q">
    <p class="prompt"><span class="qlabel">${label}</span>${Q.q}</p>
    <ul class="options">${ord.map((k,i)=>{
      const o = Q.options[k];
      let cls = "";
      if(answered) cls = "locked " + (o.ok ? "correct" : (k===picked ? "picked-wrong" : "other"));
      const verdict = o.ok ? (k===picked ? "Correct — your answer" : "Correct answer") : (k===picked ? "Wrong — your answer" : "Wrong");
      return `<li class="opt ${cls}"><button data-q="${id}" data-k="${k}" ${answered?'tabindex="-1" aria-disabled="true"':""}><span class="letter">${LETTERS[i]}</span><span class="otext">${o.t}</span></button><div class="why"><span class="verdict">${verdict}</span>${o.why}</div></li>`;
    }).join("")}</ul></div>`;
}

function renderNav(){
  const sel = document.getElementById("modsel");
  sel.innerHTML = COURSE.map((M,i)=>{
    const st = !M.soon && quizStats(i).done ? ` ✓ ${quizStats(i).right}/${quizStats(i).total}` : "";
    return `<option value="${i}" ${M.soon?"disabled":""} ${i===S.m && S.view!=="glossary"?"selected":""}>${i+1}. ${M.title}${M.soon?` (${M.sub.toLowerCase()})`:st}</option>`;
  }).join("");
  if(S.view==="glossary"){ sel.selectedIndex = -1; }
  document.getElementById("glossaryBtn").setAttribute("aria-pressed", S.view==="glossary");
}

function render(){
  renderNav();
  const app = document.getElementById("app");
  if(S.view === "glossary") return renderGlossary(app);
  const M = COURSE[S.m], n = M.lessons.length;
  const qs = quizStats(S.m);
  const tabs = M.lessons.map((L,i)=>`<button class="tab ${lessonDone(S.m,i)?"done":""}" aria-current="${S.l===i}" data-l="${i}">${lessonDone(S.m,i)?"✓ ":""}${i+1}. ${L.title}</button>`).join("")
    + `<button class="tab ${qs.done?"done":""}" aria-current="${S.l===n}" data-l="${n}">${qs.done?`✓ Quiz ${qs.right}/${qs.total}`:"Module quiz"}</button>`;

  if(S.l < n){
    const L = M.lessons[S.l];
    app.innerHTML = `<nav class="tabs" aria-label="Lessons">${tabs}</nav>
    <article class="card">
      <div class="kicker">Module ${S.m+1}: ${M.title} · Lesson ${S.l+1} of ${n}</div>
      <h2>${L.title}</h2>
      <div class="body">${L.body}</div>
      ${L.example?`<aside class="example"><strong>Example</strong>${L.example}</aside>`:""}
    </article>
    <section class="card"><h3>Check yourself</h3>${L.checks.map((Q,i)=>qHTML(Q, `${S.m}.${S.l}.${i}`, L.checks.length>1?`Q${i+1}. `:"")).join("")}</section>
    <div class="actions">
      <button class="btn ghost" data-l="${S.l-1}" ${S.l===0?"disabled":""}>Previous lesson</button>
      <button class="btn" data-l="${S.l+1}">${S.l===n-1?"Go to module quiz":"Next lesson"}</button>
    </div>`;
  } else {
    const nextReady = COURSE[S.m+1] && !COURSE[S.m+1].soon;
    app.innerHTML = `<nav class="tabs" aria-label="Lessons">${tabs}</nav>
    <article class="card">
      <div class="kicker">Module ${S.m+1}: ${M.title}</div>
      <h2>Module quiz</h2>
      <p class="muted" style="margin:0">${qs.total} questions mixing everything in this module. Answer all of them to see your score.</p>
    </article>
    <section class="card">${M.quiz.map((Q,i)=>qHTML(Q, `${S.m}.q.${i}`, `${i+1}. `)).join("")}</section>
    ${qs.done ? `<section class="card"><h3>Score: ${qs.right} of ${qs.total} (${Math.round(qs.right/qs.total*100)}%)</h3>
      <p>${qs.right/qs.total>=0.8?"Solid. You're ready for the next module.":"Reread the explanations of the ones you missed, then retry. The options get reshuffled."}</p>
      <div class="actions"><button class="btn ghost" id="retry">Retry quiz</button>${nextReady?`<button class="btn" data-module="${S.m+1}">Next module</button>`:`<span class="muted">The next module is coming soon.</span>`}</div></section>`
    : `<p class="muted">${qs.answered} of ${qs.total} answered.</p>`}
    <div class="actions"><button class="btn ghost" data-l="${n-1}">Back to last lesson</button></div>`;
  }
}

function renderGlossary(app){
  app.innerHTML = `<article class="card"><h2>Glossary</h2>
    <p class="muted" style="margin:0 0 12px">Every abbreviation and service name used in the course. The module number shows where it's taught.</p>
    <label for="gsearch" class="muted">Search</label>
    <input type="search" id="gsearch" placeholder="e.g. NAT, KMS, gateway" autocomplete="off">
    <dl class="gloss" id="glist"></dl></article>`;
  const input = document.getElementById("gsearch");
  const draw = () => {
    const f = input.value.trim().toLowerCase();
    const rows = GLOSSARY.filter(g => !f || g.slice(0,3).join(" ").toLowerCase().includes(f));
    document.getElementById("glist").innerHTML = rows.length ? rows.map(g=>`<div><dt>${g[0]} <span>· ${g[1]}</span></dt><dd>${g[2]} <span class="tag">Module ${g[3]}</span></dd></div>`).join("") : `<p class="muted">No matches.</p>`;
  };
  input.addEventListener("input", draw);
  draw();
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b || b.disabled) return;
  if(b.dataset.q !== undefined){
    if(S.answers[b.dataset.q] === undefined){ S.answers[b.dataset.q] = +b.dataset.k; save(); const y = window.scrollY; render(); window.scrollTo(0,y); }
    return;
  }
  if(b.dataset.l !== undefined){ S.l = +b.dataset.l; S.view = "module"; save(); render(); scrollTop(); return; }
  if(b.dataset.module !== undefined){ S.m = +b.dataset.module; S.l = 0; S.view = "module"; save(); render(); scrollTop(); return; }
  if(b.id === "glossaryBtn"){ S.view = S.view === "glossary" ? "module" : "glossary"; save(); render(); scrollTop(); return; }
  if(b.id === "retry"){
    COURSE[S.m].quiz.forEach((_,i)=>{ delete S.answers[`${S.m}.q.${i}`]; delete S.orders[`${S.m}.q.${i}`]; });
    save(); render(); scrollTop(); return;
  }
});
document.getElementById("modsel").addEventListener("change", e => { S.m = +e.target.value; S.l = 0; S.view = "module"; save(); render(); scrollTop(); });

if(!COURSE[S.m] || COURSE[S.m].soon){ S.m = 0; S.l = 0; }
render();
</script>
</body>
</html>
